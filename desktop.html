<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>窗口与屏幕录制 · 映录</title><link rel="stylesheet" href="styles.css"></head><body class="wide">
<header class="brand"><span class="brand-icon">◧</span><div><strong>映录</strong><span class="wordmark">SCREEN RECORDER</span></div><a href="library.html" class="text-button" style="margin-left:auto">本地录制库 ↗</a></header>
<span class="eyebrow">独立录制</span><h1>选择画面，留下过程。</h1><p class="lead">可录制标签页、窗口或整个屏幕。选定来源后，可以在预览上拖出录制范围。完成后保存在本地录制库，可回看并选择下载。</p>
<div class="notice">此模式提供基础录屏。实时网页标注请使用插件侧栏；整屏录制会包含屏幕上可见的控制窗口，请将本页最小化或移到另一块屏幕。录制期间保持本页打开。</div>
<div id="error" class="notice error" role="alert" hidden></div>
<section class="card"><div class="row desktop-controls"><label><input id="audio" type="checkbox" checked> 来源声音</label><label><input id="mic" type="checkbox"> 麦克风</label><label>画质 <select id="quality"><option value="1080">高清 · 长边 1920</option><option value="720">流畅 · 长边 1280</option><option value="performance">低负载 · 采集长边 1280</option><option value="original">原始尺寸</option></select></label><label>帧率 <select id="fps"><option value="30">30 FPS</option><option value="20">20 FPS · 低负载</option><option value="60">60 FPS</option></select></label></div>
<div class="row desktop-controls"><label>视频格式 <select id="format"><option value="webm">WebM</option><option id="format-mp4" value="mp4">MP4</option></select></label><span id="format-hint" class="micro"></span></div>
<div class="row"><button id="choose" class="primary">选择录制来源</button><button id="release-source" class="outline" disabled>释放来源</button><button id="full" class="outline" disabled>使用完整画面</button><span id="range-label" class="subtle">尚未选择来源</span></div>
<div id="stage" class="crop-stage" hidden><video id="source" autoplay muted playsinline></video><canvas id="crop"></canvas></div>
<div class="row desktop-controls"><button id="start" class="primary" disabled>开始录制</button><button id="pause" class="outline" hidden>暂停</button><button id="stop" class="stop" hidden>结束并保存</button><time id="timer">00:00:00</time><span id="status" class="subtle">准备就绪</span></div><p id="export-notice" class="micro" role="status" hidden></p><button id="cancel-export" class="outline" hidden>取消导出</button><div id="result"></div></section>
<script type="module" src="desktop.js"></script></body></html>
